kind = "web"
previewPath = "/"
title = "Job Radar"
description = "A personal job-monitoring dashboard that tracks public company career sources, scores new roles against transparent candidate preferences, and keeps notification history in one place."
version = "1.0.0"
id = "artifacts/job-radar"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22860

[services.development]
run = "pnpm --filter @workspace/job-radar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/job-radar", "run", "build" ]
serve = "static"
publicDir = "artifacts/job-radar/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22860"
BASE_PATH = "/"
