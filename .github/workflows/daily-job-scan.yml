name: Daily Job Radar Scan

on:
  schedule:
    # 06:00 Asia/Kolkata (00:30 UTC)
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Job Radar scan
        env:
          JOBRADAR_API_URL: https://job-radar-nfgv.onrender.com
          JOBRADAR_SCHEDULER_SECRET: ${{ secrets.JOBRADAR_SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$JOBRADAR_SCHEDULER_SECRET" ]; then
            echo "JOBRADAR_SCHEDULER_SECRET is not configured in GitHub Actions."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --max-time 600 \
            -X POST \
            -H "X-JobRadar-Scheduler-Secret: $JOBRADAR_SCHEDULER_SECRET" \
            "$JOBRADAR_API_URL/api/internal/scheduler/scan"
