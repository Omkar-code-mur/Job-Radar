name: Patch Workday integration

on:
  push:
    branches:
      - feat/source-synechron

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/source-synechron
          fetch-depth: 0

      - name: Patch Workday registrations
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('artifacts/job-radar/src/App.tsx')
          text = app.read_text(encoding='utf-8')
          if 'value="WORKDAY_API"' not in text:
              needle = '''              <option value="DELOITTE_USI">\n                Deloitte USI careers\n              </option>\n\n              <option value="LEVER_API">'''
              replacement = '''              <option value="DELOITTE_USI">\n                Deloitte USI careers\n              </option>\n\n              <option value="WORKDAY_API">\n                Workday API\n              </option>\n\n              <option value="LEVER_API">'''
              if needle not in text:
                  raise SystemExit('Expected App.tsx connector block was not found')
              app.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          program = Path('artifacts/api-server-dotnet/Program.cs')
          text = program.read_text(encoding='utf-8')
          needle = '''    "GREENHOUSE_API",\n    "DELOITTE_USI"\n};'''
          replacement = '''    "GREENHOUSE_API",\n    "DELOITTE_USI",\n    "WORKDAY_API"\n};'''
          if '"WORKDAY_API"' not in text:
              if needle not in text:
                  raise SystemExit('Expected Program.cs monitorable source block was not found')
              program.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/job-radar/src/App.tsx artifacts/api-server-dotnet/Program.cs
          if git diff --cached --quiet; then
            echo "Workday registrations already present"
            exit 0
          fi
          git commit -m "fix(workday): expose connector and monitorable source"
          git push origin feat/source-synechron
